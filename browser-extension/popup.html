<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Job Application Tracker</title>
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <main>
    <header>
      <span class="mark" aria-hidden="true">JT</span>
      <div>
        <p class="eyebrow">Job Application Tracker</p>
        <h1>Extract or fill</h1>
      </div>
    </header>

    <p class="reminder">Make sure the full job description is visible. Click “See more” before capturing.</p>

    <form id="capture-form">
      <button class="secondary" type="submit">Extract <small>Job ad to a private review draft</small></button>
      <button id="fill" type="button">Fill <small>Saved profile to this form</small></button>
    </form>

    <p id="status" class="status" role="status" aria-live="polite"></p>
    <p id="fill-status" class="status" role="status"></p>
    <button id="undo-fill" class="text-button" type="button" hidden>Undo last fill</button>
    <details id="connection">
      <summary id="connection-summary">Autofill profile</summary>
      <p><a id="manage-profile" target="_blank" rel="noreferrer">Manage your autofill profile</a></p>
    </details>
    <p class="privacy">Active tab only · <a id="privacy-link" target="_blank" rel="noreferrer">Privacy details</a></p>
  </main>
  <script src="tracker-config.js"></script>
  <script src="popup.js"></script>
  <script type="module" src="autofill-popup.js"></script>
</body>
</html>
