name: Quality

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build-and-test:
    name: Build and test
    runs-on: ubuntu-latest
    timeout-minutes: 15

    env:
      DOTNET_CLI_TELEMETRY_OPTOUT: 1
      DOTNET_NOLOGO: true
      NUGET_XMLDOC_MODE: skip

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up .NET
        uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json
          cache: true
          cache-dependency-path: "**/packages.lock.json"

      - name: Restore locked dependencies
        run: dotnet restore --locked-mode

      - name: Audit dependency vulnerabilities
        run: dotnet list JobTracker.sln package --vulnerable --include-transitive

      - name: Verify formatting
        run: dotnet format --verify-no-changes --no-restore

      - name: Build release
        run: dotnet build --configuration Release --no-restore

      - name: Install Playwright Chromium
        run: pwsh tests/JobTracker.BrowserTests/bin/Release/net10.0/playwright.ps1 install --with-deps chromium

      - name: Run tests
        run: dotnet test --configuration Release --no-build

      - name: Validate publish output
        run: dotnet publish src/JobTracker.Web --configuration Release --no-build --output artifacts/publish
