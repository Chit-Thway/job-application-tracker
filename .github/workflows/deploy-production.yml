name: Deploy production

on:
  workflow_dispatch:
    inputs:
      publish_only:
        description: Publish the container image without updating the production app
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: production
  cancel-in-progress: false

jobs:
  publish:
    name: Validate and publish image
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      packages: write
    outputs:
      image: ${{ steps.publish.outputs.image }}

    env:
      DOTNET_CLI_TELEMETRY_OPTOUT: 1
      DOTNET_NOLOGO: true
      NUGET_XMLDOC_MODE: skip

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up .NET
        uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json
          cache: true
          cache-dependency-path: "**/packages.lock.json"

      - name: Restore locked dependencies
        run: dotnet restore --locked-mode

      - name: Verify formatting
        run: dotnet format --verify-no-changes --no-restore

      - name: Build release
        run: dotnet build --configuration Release --no-restore

      - name: Run unit tests
        run: dotnet test tests/JobTracker.UnitTests --configuration Release --no-build

      - name: Run integration tests
        run: dotnet test tests/JobTracker.IntegrationTests --configuration Release --no-build

      - name: Publish release image
        id: publish
        env:
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          registry_repository="${GITHUB_REPOSITORY,,}"
          image="ghcr.io/$registry_repository:$GITHUB_SHA"
          printf '%s' "$GHCR_TOKEN" | docker login ghcr.io --username "$GITHUB_ACTOR" --password-stdin
          dotnet publish src/JobTracker.Web --configuration Release --no-restore /t:PublishContainer \
            -p:UseAppHost=false -p:ContainerRuntimeIdentifier=linux-x64 \
            -p:ContainerBaseImage=mcr.microsoft.com/dotnet/aspnet:10.0-noble-chiseled-extra \
            -p:ContainerRegistry=ghcr.io "-p:ContainerRepository=$registry_repository" \
            "-p:ContainerImageTag=$GITHUB_SHA"
          digest=$(docker buildx imagetools inspect "$image" --format '{{json .Manifest}}' | jq -er '.digest')
          [[ "$digest" =~ ^sha256:[[:xdigit:]]{64}$ ]]
          printf 'image=ghcr.io/%s@%s\n' "$registry_repository" "$digest" >> "$GITHUB_OUTPUT"

  deploy:
    name: Deploy to Azure Container Apps
    if: github.ref == 'refs/heads/main' && !inputs.publish_only
    needs: publish
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      id-token: write
      packages: read
    environment:
      name: production
      url: https://myjobtracker.com.au

    steps:
      - name: Sign in to Azure with OpenID Connect
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Verify administrator setup
        shell: bash
        env:
          AZURE_CONTAINER_APP: ${{ vars.AZURE_CONTAINER_APP }}
          AZURE_RESOURCE_GROUP: ${{ vars.AZURE_RESOURCE_GROUP }}
          RELEASE_IMAGE: ${{ needs.publish.outputs.image }}
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          : "${AZURE_CONTAINER_APP:?Set the production Container App name}"
          : "${AZURE_RESOURCE_GROUP:?Set the production resource group}"
          : "${RELEASE_IMAGE:?The release image digest is missing}"
          printf '%s' "$GHCR_TOKEN" | docker login ghcr.io --username "$GITHUB_ACTOR" --password-stdin
          unset GHCR_TOKEN

          settings=$(az containerapp show --name "$AZURE_CONTAINER_APP" --resource-group "$AZURE_RESOURCE_GROUP" \
            --query "properties.template.containers[0].env[?name=='ConnectionStrings__DefaultConnection' || name=='Admin__BootstrapEmail']" \
            --only-show-errors --output json)

          read_app_setting() {
            local setting secret_ref
            setting=$(jq -c --arg name "$1" 'map(select(.name == $name))[0] // {}' <<< "$settings")
            secret_ref=$(jq -r '.secretRef // empty' <<< "$setting")
            if [[ -n "$secret_ref" ]]; then
              az containerapp secret list --name "$AZURE_CONTAINER_APP" --resource-group "$AZURE_RESOURCE_GROUP" \
                --show-values --only-show-errors --output json |
                jq -er --arg name "$secret_ref" 'map(select(.name == $name))[0].value | select(type == "string" and length > 0)'
            else
              jq -r '.value // empty' <<< "$setting"
            fi
          }

          ConnectionStrings__DefaultConnection=$(read_app_setting ConnectionStrings__DefaultConnection)
          Admin__BootstrapEmail=$(read_app_setting Admin__BootstrapEmail)
          : "${ConnectionStrings__DefaultConnection:?The production database connection is missing}"
          printf '::add-mask::%s\n' "$ConnectionStrings__DefaultConnection"
          if [[ -n "$Admin__BootstrapEmail" ]]; then
            printf '::add-mask::%s\n' "$Admin__BootstrapEmail"
          fi
          export ConnectionStrings__DefaultConnection Admin__BootstrapEmail
          docker run --rm --entrypoint dotnet -e ASPNETCORE_ENVIRONMENT=Production \
            -e ConnectionStrings__DefaultConnection -e Admin__BootstrapEmail \
            "$RELEASE_IMAGE" JobTracker.Web.dll --initialize-admin

      - name: Deploy validated image
        env:
          AZURE_CONTAINER_APP: ${{ vars.AZURE_CONTAINER_APP }}
          AZURE_RESOURCE_GROUP: ${{ vars.AZURE_RESOURCE_GROUP }}
          RELEASE_IMAGE: ${{ needs.publish.outputs.image }}
        run: |
          : "${AZURE_CONTAINER_APP:?Set the production Container App name}"
          : "${AZURE_RESOURCE_GROUP:?Set the production resource group}"
          : "${RELEASE_IMAGE:?The release image digest is missing}"
          az containerapp update --name "$AZURE_CONTAINER_APP" --resource-group "$AZURE_RESOURCE_GROUP" \
            --image "$RELEASE_IMAGE" --only-show-errors --output none
